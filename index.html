<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çizgi Kanal">
<meta name="theme-color" content="#0b0912">
<title>Çizgi Kanal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=VT323&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--phos:#7dffb2;--amber:#ffcf5a;--hot:#ff4d6d;--ink:#f4efe6;--muted:#a79fb8;--panel:#17141f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#tv{position:fixed;inset:0;background:#000;user-select:none;-webkit-user-select:none}
#player-wrap{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#player-wrap iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
/* dokunma yakalayıcı: kumandayı açar; videoya tıklamak yerine */
#tap{position:absolute;inset:0;z-index:3}
#tv.showui #tap{bottom:120px}

.bug{position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));font-family:'Bungee',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;opacity:.55;display:flex;align-items:center;gap:7px;pointer-events:none;text-shadow:0 1px 4px #000}
.bug i{width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* alt üçte bir: şimdi / sırada */
#lower{position:absolute;z-index:6;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:0;transform:translateY(20px);opacity:0;transition:.45s;pointer-events:none}
#lower.on{transform:none;opacity:1}
#lower .tag{background:var(--hot);color:#fff;font-family:'Bungee',sans-serif;font-size:13px;padding:8px 12px;letter-spacing:1px}
#lower .txt{background:#000c;backdrop-filter:blur(6px);padding:8px 14px;font-family:'VT323',monospace;font-size:22px;color:var(--phos)}

/* kontrol çubuğu */
#ui{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:14px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  background:linear-gradient(#0000,#000e 40%);display:flex;align-items:center;gap:12px;transform:translateY(100%);transition:transform .3s}
#tv.showui #ui{transform:none}
#tv.showui #lower{opacity:0}
.np{flex:1;min-width:0;font-family:'VT323',monospace;line-height:1.05}
.np .a{font-size:15px;color:var(--amber)}
.np .b{font-family:'Bungee',sans-serif;font-size:clamp(16px,2.6vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .c{font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{appearance:none;border:0;cursor:pointer;width:52px;height:52px;border-radius:16px;background:#ffffff1a;color:#fff;font-size:22px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.cb:active{transform:scale(.94)}
.cb.zap{background:var(--amber);color:#2a1a00;width:auto;padding:0 18px;font-family:'Bungee',sans-serif;font-size:15px;gap:6px;display:flex;align-items:center}
.cb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* zap karlanması + kanal kartı */
#static{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .2s;background:#000}
#static canvas{width:100%;height:100%;image-rendering:pixelated;opacity:.85}
#static.on{opacity:1}
#card{position:absolute;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
#card.on{opacity:1}
#card .box{text-align:center;font-family:'VT323',monospace;color:var(--phos);text-shadow:0 0 10px #7dffb2aa;padding:22px 30px;background:#000a;border:2px solid #7dffb255;border-radius:18px}
#card .lbl{font-size:24px;color:var(--amber)}
#card .show{font-family:'Bungee Shade',cursive;font-size:clamp(34px,7vw,72px);color:#eafff2;line-height:1.05;margin:4px 0}
#card .next{font-size:22px;color:var(--muted)}
.scan{position:absolute;inset:0;z-index:10;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0000002e 2px 3px);opacity:0;transition:opacity .3s}
#static.on~.scan,#card.on~.scan{opacity:1}

/* açılış ekranı */
#start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
  background:radial-gradient(900px 600px at 50% 0%,#2a1f45,#0b0912 70%);text-align:center}
#start h1{font-family:'Bungee Shade',cursive;font-size:clamp(46px,11vw,110px);line-height:.95;color:#eafff2;text-shadow:0 0 24px #7dffb266}
#start p{color:var(--muted);max-width:520px;line-height:1.5;font-size:15px}
.go{appearance:none;border:0;cursor:pointer;font-family:'Bungee',sans-serif;font-size:20px;letter-spacing:1px;padding:18px 34px;border-radius:20px;color:#fff;background:linear-gradient(#ff5d78,#d22f50);box-shadow:0 7px 0 #7a1328,0 18px 30px -10px #ff4d6d88}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 #7a1328}
.link{background:none;border:0;color:var(--amber);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer}

/* dizi paneli */
#panel{position:absolute;z-index:30;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);box-shadow:-20px 0 40px #000a;transform:translateX(105%);transition:transform .3s;
  display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 18px}
#panel.on{transform:none}
#panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#panel h2{font-family:'Bungee',sans-serif;font-size:16px;letter-spacing:2px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;padding-bottom:8px}
.key{appearance:none;border:0;cursor:pointer;border-radius:14px;padding:11px 10px;text-align:left;font-family:inherit;background:#2a2535;color:var(--ink);position:relative;min-height:58px}
.key b{display:block;font-size:13.5px;line-height:1.15}
.key small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.key::after{content:"";position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#555}
.key.on{background:#3a3150}.key.on::after{background:var(--phos);box-shadow:0 0 8px var(--phos)}
.key.na{opacity:.38;cursor:not-allowed}.key.na::after{background:#6b2232}
.prow{display:flex;gap:8px;margin-top:10px}
.pbtn{flex:1;appearance:none;border:0;cursor:pointer;border-radius:12px;padding:12px;font-family:'Bungee',sans-serif;font-size:12px;letter-spacing:1px;background:#2a2535;color:#fff}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.toast{position:absolute;z-index:40;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:#000d;padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="tv">
  <div id="player-wrap"><div id="player"></div></div>
  <div id="tap"></div>
  <div class="bug"><i></i>ÇİZGİ KANAL</div>
  <div id="lower"><div class="tag">SIRADA</div><div class="txt" id="lowerTxt"></div></div>

  <div id="ui">
    <button class="cb" id="prev" title="Önceki" aria-label="Önceki bölüm"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16ZM5 19V5"/></svg></button>
    <button class="cb" id="play" title="Oynat / Duraklat" aria-label="Oynat veya duraklat"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
    <div class="np"><div class="a">ŞİMDİ</div><div class="b" id="npShow">—</div><div class="c" id="npNext"></div></div>
    <button class="cb zap" id="zap" aria-label="Sonraki bölüm">ZAP <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4ZM19 5v14"/></svg></button>
    <button class="cb" id="list" title="Diziler" aria-label="Dizileri seç"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="cb" id="fs" title="Tam ekran" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div id="static"><canvas id="noise"></canvas></div>
  <div id="card"><div class="box"><div class="lbl" id="cardLbl">ŞİMDİ</div><div class="show" id="cardShow"></div><div class="next" id="cardNext"></div></div></div>
  <div class="scan"></div>

  <div id="start">
    <h1>ÇİZGİ<br>KANAL</h1>
    <p>Seçtiğin çizgi filmlerden rastgele bölümler, bir kanal gibi arka arkaya. Bölüm bitince kısa bir geçişle sıradaki gelir. Ekrana dokununca kumanda açılır.</p>
    <button class="go" id="go">▶ YAYINI BAŞLAT</button>
    <button class="link" id="pick">Dizileri seç</button>
  </div>

  <aside id="panel" aria-label="Diziler">
    <header><h2>KANAL LİSTESİ</h2><button class="cb" id="close" aria-label="Kapat">✕</button></header>
    <div class="keys" id="keys"></div>
    <div class="prow"><button class="pbtn" id="all">HEPSİ</button><button class="pbtn" id="none">HİÇBİRİ</button></div>
    <p class="hint" id="hint"></p>
  </aside>
  <div class="toast" id="toast"></div>
</div>

const $=id=>document.getElementById(id);
const tv=$('tv');
let on=new Set(SHOWS.filter(s=>s.list.length).map(s=>s.k));
try{const sv=JSON.parse(localStorage.getItem('cizgi-kanal-on')||'null'); if(Array.isArray(sv)&&sv.length) on=new Set(sv.filter(k=>SHOWS.some(s=>s.k===k&&s.list.length)));}catch(e){}
const save=()=>{try{localStorage.setItem('cizgi-kanal-on',JSON.stringify([...on]));}catch(e){}};

/* ---------- yayın akışı: sonsuz, dengeli, tekrar etmeyen ---------- */
const decks={}; const weight={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(k){ const s=SHOWS.find(x=>x.k===k); if(!decks[k]||!decks[k].length) decks[k]=shuffle([...s.list]); return decks[k].pop(); }
let history=[], pos=-1, queue=[];
function pickShow(){
  const act=SHOWS.filter(s=>on.has(s.k)&&s.list.length); if(!act.length) return null;
  const recent=history.slice(-3).map(x=>x.k).concat(queue.map(x=>x.k)).slice(-3);
  let pool=act.filter(s=>!recent.includes(s.k)); if(!pool.length) pool=act.filter(s=>s.k!==recent[recent.length-1]); if(!pool.length) pool=act;
  const w=s=>Math.min(s.list.length,14);
  let r=Math.random()*pool.reduce((a,s)=>a+w(s),0); for(const s of pool){ r-=w(s); if(r<=0) return s; } return pool[0];
}
function fill(){ while(queue.length<3){ const s=pickShow(); if(!s) break; queue.push({k:s.k,n:s.n,id:draw(s.k)}); } }
function resetQueue(){ queue=[]; fill(); }

/* ---------- YouTube oynatıcı ---------- */
let player=null, ready=false, started=false, failStreak=0;
const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{width:'100%',height:'100%',
    playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,fs:0,disablekb:1,cc_load_policy:0,hl:'tr'},
    events:{onReady:()=>{ready=true; if(started) playCurrent();}, onStateChange:onState, onError:onErr}});
};
function cur(){ return history[pos]; }
function playCurrent(){ const c=cur(); if(!c||!ready) return; player.loadVideoById(c.id); updateNP(); }
function updateNP(){
  const c=cur(); if(!c) return; fill();
  $('npShow').textContent=c.n; $('npNext').textContent=queue[0]?('Sırada: '+queue[0].n):'';
  $('lowerTxt').textContent=queue[0]?queue[0].n:'';
}
function next(withCard=true,immediate=false){
  if(pos<history.length-1){ pos++; }
  else { fill(); const n=queue.shift(); if(!n){ toast('Kumandadan en az bir dizi seç'); openPanel(); return; } history.push(n); if(history.length>200){history.shift();} pos=history.length-1; }
  transition(withCard,null,immediate);
  setTimeout(checkStuck,4000);
}
function checkStuck(){ if(!ready) return; try{ const s=player.getPlayerState(); if(s!==1&&s!==3&&s!==2){ showUI(); toast('Başlamadıysa ▶ tuşuna bas'); } }catch(e){} }
function prev(){ if(pos>0){ pos--; transition(true,'TEKRAR'); } else toast('Bu ilk bölüm'); }
let tTimer=null;
function transition(withCard,label,immediate){
  const c=cur(); fill();
  if(!withCard){ playCurrent(); return; }
  if(immediate){ playCurrent(); }
  staticOn(); $('cardLbl').textContent=label||'ŞİMDİ'; $('cardShow').textContent=c.n; $('cardNext').textContent=queue[0]?('sonra: '+queue[0].n):'';
  clearTimeout(tTimer);
  if(ready && !immediate){ try{player.pauseVideo();}catch(e){} }
  setTimeout(()=>{ $('card').classList.add('on'); },350);
  if(!immediate) tTimer=setTimeout(()=>{ playCurrent(); },700);
  setTimeout(()=>{ $('card').classList.remove('on'); staticOff(); },2300);
}
function onState(e){
  if(e.data===YT.PlayerState.ENDED){ next(true); }
  if(e.data===YT.PlayerState.PLAYING){ failStreak=0; setPlayIco(true); scheduleLower(); }
  if(e.data===YT.PlayerState.PAUSED){ setPlayIco(false); }
}
function onErr(){ // gömülemeyen ya da silinmiş video: sessizce atla
  failStreak++; if(failStreak>8){ toast('Bağlantı sorunu olabilir'); failStreak=0; return; }
  const bad=cur(); if(bad){ history.splice(pos,1); pos--; }
  next(false);
}
/* bölümün sonuna doğru "SIRADA" alt yazısı */
let lowerIv=null;
function scheduleLower(){ clearInterval(lowerIv); lowerIv=setInterval(()=>{ if(!ready) return; try{ const d=player.getDuration(), t=player.getCurrentTime(); const show=d>60 && d-t<45 && d-t>3; $('lower').classList.toggle('on',show); }catch(e){} },1000); }
function setPlayIco(p){ $('playIco').innerHTML=p?'<path d="M8 5v14M16 5v14"/>':'<path d="M7 4v16l13-8z"/>'; }

/* ---------- karlanma ---------- */
const cv=$('noise'), cx=cv.getContext('2d'); let raf=null;
function noise(){ const im=cx.createImageData(cv.width,cv.height),d=im.data; for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;} cx.putImageData(im,0,0); raf=requestAnimationFrame(noise); }
function staticOn(){ cv.width=200; cv.height=Math.round(200*innerHeight/innerWidth)||120; $('static').classList.add('on'); cancelAnimationFrame(raf); noise(); }
function staticOff(){ $('static').classList.remove('on'); setTimeout(()=>cancelAnimationFrame(raf),250); }

/* ---------- arayüz ---------- */
let uiTimer=null;
function showUI(){ tv.classList.add('showui'); clearTimeout(uiTimer); uiTimer=setTimeout(()=>tv.classList.remove('showui'),4000); }
$('tap').addEventListener('click',()=>{ tv.classList.contains('showui')?tv.classList.remove('showui'):showUI(); });
$('ui').addEventListener('click',showUI);
$('zap').onclick=()=>next(true);
$('prev').onclick=()=>prev();
$('play').onclick=()=>{ if(!ready) return; const s=player.getPlayerState(); s===1?player.pauseVideo():player.playVideo(); };
$('list').onclick=()=>openPanel();
$('pick').onclick=()=>openPanel();
$('close').onclick=()=>closePanel();
function openPanel(){ renderKeys(); $('panel').classList.add('on'); }
function closePanel(){ $('panel').classList.remove('on'); }
$('go').onclick=()=>{
  if(!SHOWS.some(s=>on.has(s.k)&&s.list.length)){ openPanel(); toast('En az bir dizi seç'); return; }
  $('start').style.display='none'; started=true; resetQueue(); next(true,true); goFull();
};

function renderKeys(){
  $('keys').innerHTML=SHOWS.map(s=>{ const na=!s.list.length;
    const meta=na?"YouTube'da Türkçe yok":(s.sub?s.sub+' · ':'')+s.list.length+' video';
    return `<button class="key ${na?'na':(on.has(s.k)?'on':'')}" data-k="${s.k}" ${na?'aria-disabled="true"':''}><b>${s.n}</b><small>${meta}</small></button>`; }).join('');
  $('hint').textContent=on.size+' dizi açık. Değişiklik sıradaki bölümden itibaren geçerli olur.';
}
$('keys').addEventListener('click',e=>{ const b=e.target.closest('.key'); if(!b||b.classList.contains('na')) return; const k=b.dataset.k; on.has(k)?on.delete(k):on.add(k); save(); renderKeys(); resetQueue(); if(started) updateNP(); });
$('all').onclick=()=>{ on=new Set(SHOWS.filter(s=>s.list.length).map(s=>s.k)); save(); renderKeys(); resetQueue(); if(started) updateNP(); };
$('none').onclick=()=>{ on=new Set(); save(); renderKeys(); resetQueue(); };

/* tam ekran: iPad/PC'de gerçek tam ekran; iPhone'da Ana Ekran'a eklenince zaten tam ekran açılır */
function goFull(){ const el=document.documentElement; const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f && !document.fullscreenElement && !document.webkitFullscreenElement){ try{ const p=f.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } }
$('fs').onclick=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { const el=document.documentElement; if(el.requestFullscreen||el.webkitRequestFullscreen) goFull(); else toast("iPhone'da: Paylaş → Ana Ekrana Ekle, oradan aç"); } };

document.addEventListener('keydown',e=>{ if(!started) return;
  if(e.key==='ArrowRight'||e.key==='n') next(true);
  else if(e.key==='ArrowLeft') prev();
  else if(e.key===' '){ e.preventDefault(); $('play').click(); }
  else if(e.key==='f') $('fs').click();
});
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }
</script>
